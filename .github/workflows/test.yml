name: Test formulae

# A clean install the way a user does it, on a fresh macOS runner: the fully qualified name,
# no prior `brew tap`, then the formula's own test.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hokusai:
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Audit
        run: |
          brew tap-new local/check --no-git
          cp Formula/hokusai.rb "$(brew --repository local/check)/Formula/"
          brew audit --strict local/check/hokusai

      - name: Install the way a user does
        run: |
          # Taps from the repository under test, not from GitHub's default branch.
          mkdir -p "$(brew --repository)/Library/Taps/ivantokar"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/ivantokar/homebrew-tap"
          brew install ivantokar/tap/hokusai

      - name: Test
        run: |
          hokusai --version
          brew test ivantokar/tap/hokusai
          brew info ivantokar/tap/hokusai
